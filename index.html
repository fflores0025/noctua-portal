  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>

<div id="toast"></div>

<!-- LOGIN -->
<div id="login-screen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);background-image:radial-gradient(ellipse 60% 40% at 50% -5%,rgba(200,255,0,.09) 0%,transparent 65%),radial-gradient(ellipse 40% 30% at 85% 85%,rgba(255,60,172,.07) 0%,transparent 55%);">
  <div style="width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:36px 32px;">
    <div id="panel-login">
      <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:26px;margin-bottom:6px;">InOut<span style="color:var(--a1)">.</span></div>
      <div style="color:var(--muted);font-size:13px;margin-bottom:28px;line-height:1.4;">Portal del equipo · InOut Media</div>
      <div id="login-error" style="display:none;background:rgba(255,60,172,.1);border:1px solid rgba(255,60,172,.2);color:var(--a2);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;"></div>
      <label class="form-lbl">Email</label>
      <input class="form-input" id="login-email" type="email" placeholder="tu@inoutmedia.es" autocomplete="email"/>
      <label class="form-lbl">Contraseña</label>
      <input class="form-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password"/>
      <button class="btn btn-p btn-full" id="login-btn" onclick="doLogin()" style="font-size:15px;padding:12px">Entrar al portal</button>
      <div style="margin-top:10px;text-align:center">
        <span style="font-size:12px;color:var(--a3);cursor:pointer;text-decoration:underline" onclick="mostrarPanelReset()">¿Olvidaste tu contraseña?</span>
      </div>
    </div>
    <div id="panel-reset" style="display:none">
      <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:26px;margin-bottom:6px;">InOut<span style="color:var(--a1)">.</span></div>
      <div style="color:var(--muted);font-size:13px;margin-bottom:20px;">Recuperar contraseña</div>
      <div id="reset-msg" style="display:none;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;"></div>
      <label class="form-lbl">Tu email</label>
      <input class="form-input" id="reset-email" type="email" placeholder="tu@inoutmedia.es"/>
      <button class="btn btn-p btn-full" onclick="enviarResetEmail()" style="font-size:15px;padding:12px">Enviar enlace</button>
      <div style="margin-top:10px;text-align:center">
        <span style="font-size:12px;color:var(--a3);cursor:pointer;text-decoration:underline" onclick="mostrarPanelLogin()">← Volver al inicio</span>
      </div>
    </div>

    <!-- PANEL NUEVA CONTRASEÑA — se muestra al llegar desde el email de recovery -->
    <div id="panel-nueva-pass" style="display:none">
      <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:26px;margin-bottom:6px;">InOut<span style="color:var(--a1)">.</span></div>
      <div style="color:var(--muted);font-size:13px;margin-bottom:20px;">Elige tu nueva contraseña</div>
      <div id="nueva-pass-msg" style="display:none;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;"></div>
      <label class="form-lbl">Nueva contraseña</label>
      <input class="form-input" id="nueva-pass" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password"/>
      <label class="form-lbl">Confirmar contraseña</label>
      <input class="form-input" id="nueva-pass-confirm" type="password" placeholder="Repite la contraseña" autocomplete="new-password"/>
      <button class="btn btn-p btn-full" id="nueva-pass-btn" onclick="guardarNuevaPassword()" style="font-size:15px;padding:12px">Guardar contraseña</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="s-logo">
      <span>InOut<span class="logo-dot">.</span></span>
      <button class="s-logo-close" onclick="closeSidebar()">✕</button>
    </div>
    <div class="s-user" onclick="irA('perfil')" title="Ver mi perfil">
      <div class="avatar" id="s-avatar">--</div>
      <div style="flex:1;min-width:0">
        <div class="u-name" id="s-name">—</div>
        <div class="u-role" id="s-role">—</div>
      </div>
      <span class="s-user-arrow">›</span>
    </div>
    <nav class="nav" id="nav-items"></nav>
    <div class="s-bottom">
      <button class="btn-logout" onclick="doLogout()">Cerrar sesión</button>
    </div>
  </aside>
  <div class="main-area">
    <div class="topbar">
      <button class="burger" id="burger-btn" onclick="toggleSidebar()">☰</button>
      <span class="topbar-title" id="topbar-title">Portal</span>
      <div class="topbar-right">
        <a href="https://inout-valid.vercel.app" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--txt);font-size:12px;text-decoration:none;transition:border-color .15s" onmouseover="this.style.borderColor='var(--a3)'" onmouseout="this.style.borderColor='var(--border)'">📡 <span>Valid</span></a>
        <div class="notif-btn" onclick="toast('Sin notificaciones nuevas')">🔔</div>
        <div class="avatar" id="tb-avatar" style="width:32px;height:32px;font-size:11px;cursor:pointer" onclick="irA('perfil')">--</div>
      </div>
    </div>
    <div class="main-content" id="page-content"></div>
  </div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-body"></div>
</div>

// ── ROUTER ──
function irA(page) {
  const adminPages = ['admin','admin-irpf','admin-nominas','admin-turnos'];
  if (adminPages.includes(page) && !canAdmin()) { toast('⛔ Sin acceso'); return; }
  const extPages = ['dashboard','perfil','mensajes'];
  if (userProfile?.role === 'empresa_externa' && !extPages.includes(page)) { toast('⛔ Sin acceso'); return; }

  // Marcar nav activo
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`nav-${page}`)?.classList.add('active');
  document.getElementById('topbar-title').textContent = PAGE_TITLE[page] || page;
  closeSidebar();

  if (page === 'dashboard') {
    window.location.hash = 'dashboard';
    renderDashboard();
    return;
  }

  if (PAGE_ROUTES[page]) {
    // Pasar sesión a la subpágina via sessionStorage
    sessionStorage.setItem('connect_profile', JSON.stringify(userProfile));
    sessionStorage.setItem('connect_org', JSON.stringify(orgData));
    window.location.href = PAGE_ROUTES[page];
    return;
  }

  document.getElementById('page-content').innerHTML =
    `<div class="card"><div style="text-align:center;padding:40px;color:var(--muted)">Página "${page}" próximamente</div></div>`;
}

// ── BUILD NAV ──
function buildNav(role) {
  const items = NAV_CONFIG[role] || NAV_CONFIG.empleado;
  document.getElementById('nav-items').innerHTML = items.map(i => {
    if (i.sec) return `<div class="nav-sec">${i.sec}</div>`;
    return `<div class="nav-item" id="nav-${i.key}" onclick="irA('${i.key}')"><span class="nav-icon">${i.icon}</span><span>${i.label}</span></div>`;
  }).join('');
}

// ── ENTER APP ──
function enterApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  initSidebar();
  buildNav(userProfile.role);
  const hash = window.location.hash.replace('#','');
  irA(hash || 'dashboard');
}

function initSidebar() {
  const ini = initials(userProfile.nombre);
  const avc = avatarColor(userProfile.role);
  ['s-avatar','tb-avatar'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = ini;
    el.className = `avatar ${avc}`;
  });
  document.getElementById('s-name').textContent = userProfile.nombre;
  document.getElementById('s-role').textContent = userProfile.role;
}

// ── DASHBOARD (único módulo que queda en index.html) ──
let DEMO_NOMINAS=[], DEMO_EVENTOS=[], DEMO_TURNOS=[];

async function renderDashboard() {
  const pc = document.getElementById('page-content');
  pc.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:20px">Cargando…</div>`;

  try {
    const [rNom, rEv, rTurn] = await Promise.all([
      supabase.from('nominas').select('*').eq('empleado_id', userProfile._id).order('created_at',{ascending:false}).limit(5),
      supabase.from('events').select('*').order('fecha_inicio',{ascending:false}).limit(10),
      supabase.from('turnos').select('*').eq('empleado_id', userProfile._id).order('fecha').limit(10),
    ]);
    DEMO_NOMINAS = rNom.data || [];
    DEMO_EVENTOS = (rEv.data || []).map(e => ({
      ...e,
      fecha: (e.fecha_inicio||'').slice(0,10),
      hora_inicio: (e.fecha_inicio||'').slice(11,16),
      lugar: `${e.venue_nombre||''}${e.venue_ciudad?', '+e.venue_ciudad:''}`,
    }));
    DEMO_TURNOS = (rTurn.data || []).map(t => ({
      ...t, entrada:t.hora_inicio||'—', salida:t.hora_fin||'—', lugar:t.notas||'—'
    }));
  } catch(e) {}

  const p = userProfile;
  const hoy = new Date().toISOString().slice(0,10);
  const prox = DEMO_TURNOS.find(t => t.fecha >= hoy && t.tipo !== 'libre') || DEMO_TURNOS[0];
  const ultimaNomina = DEMO_NOMINAS[0] || { neto:0, estado:'pendiente' };

  pc.innerHTML = `
    <div class="page-hd"><div><div class="page-title">Hola, ${p.nombre.split(' ')[0]} 👋</div><div class="page-sub">Resumen de actividad</div></div></div>
    <div class="g4 mb24">
      <div class="stat"><div class="stat-lbl">Próximo turno</div>
        <div class="stat-val c-a1" style="font-size:15px">${prox ? new Date((prox.fecha||'2025-01-01')+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}) : 'Sin turnos'}</div>
        <div class="stat-note">${prox ? (prox.lugar||'—')+' · '+(prox.tipo==='libre'?'Libre':(prox.entrada||'')+'-'+(prox.salida||'')) : 'Contacta con RRHH'}</div>
      </div>
      <div class="stat"><div class="stat-lbl">Nómina</div>
        <div class="stat-val" style="font-size:18px">${(ultimaNomina.neto||0).toLocaleString()}€</div>
        <div class="stat-note">${badge(ultimaNomina.estado||'pendiente')}</div>
      </div>
      <div class="stat"><div class="stat-lbl">Eventos activos</div>
        <div class="stat-val c-a3">${DEMO_EVENTOS.filter(e=>['confirmado','produccion','publicado'].includes(e.estado)).length}</div>
        <div class="stat-note">Confirmados o en producción</div>
      </div>
      <div class="stat"><div class="stat-lbl">IRPF aplicado</div>
        <div class="stat-val c-a2">${p.irpf}%</div>
        <div class="stat-note" style="cursor:pointer;color:var(--a3);text-decoration:underline" onclick="irA('retribuciones')">Modificar</div>
      </div>
    </div>
    <div class="g2 mb16">
      <div class="card">
        <div class="card-title">Tus próximos turnos</div>
        ${DEMO_TURNOS.length === 0
          ? `<div style="color:var(--muted);font-size:13px;padding:10px 0;text-align:center">Sin turnos asignados</div>`
          : DEMO_TURNOS.slice(0,5).map(t => {
              const d = new Date((t.fecha||'2025-01-01')+'T12:00:00');
              const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
              const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
              return `<div style="display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.04)">
                <span style="width:85px;font-size:13px;font-weight:500">${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]}</span>
                <span style="width:7px;height:7px;border-radius:50%;background:${t.tipo==='evento'?'var(--a2)':t.tipo==='rodaje'?'var(--a1)':t.tipo==='libre'?'var(--muted)':'var(--a3)'}"></span>
                <span style="font-size:12px;color:var(--muted);width:115px">${t.tipo==='libre'?'Libre':`${t.entrada}–${t.salida}`}</span>
                <span style="font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.lugar||'—'}</span>
              </div>`;
            }).join('')}
      </div>
      <div class="card">
        <div class="card-title">Próximos eventos</div>
        ${DEMO_EVENTOS.slice(0,3).map(ev => `
          <div style="padding:11px;background:var(--bg);border-radius:9px;border:1px solid var(--border);margin-bottom:8px;cursor:pointer" onclick="irA('eventos')">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
              <span style="font-family:Syne,sans-serif;font-weight:600;font-size:13px">${ev.nombre}</span>${badge(ev.estado)}
            </div>
            <div style="font-size:12px;color:var(--muted)">📅 ${ev.fecha} &nbsp;·&nbsp; 📍 ${ev.lugar}</div>
          </div>`).join('')}
        ${DEMO_EVENTOS.length === 0 ? `<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">Sin eventos</div>` : ''}
      </div>
    </div>`;
}

// ── LOGIN ──
function setLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg; el.style.display = msg ? 'block' : 'none';
}
function setLoginLoading(on) {
  document.getElementById('login-btn').disabled = on;
  document.getElementById('login-btn').textContent = on ? 'Entrando…' : 'Entrar al portal';
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  setLoginError('');
  if (!email || !pass) { setLoginError('Introduce email y contraseña.'); return; }
  setLoginLoading(true);
  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    currentUser = data.user;
    await checkSession(enterApp, () => {
      setLoginLoading(false);
      setLoginError('Perfil no encontrado. Contacta con el administrador.');
    });
  } catch(e) {
    setLoginLoading(false);
    const msgs = { 'Invalid login credentials': 'Email o contraseña incorrectos.', 'Email not confirmed': 'Confirma tu email primero.' };
    setLoginError(msgs[e.message] || 'Error: ' + e.message);
  }
}

document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function mostrarPanelReset() {
  document.getElementById('panel-login').style.display = 'none';
  document.getElementById('panel-reset').style.display = 'block';
  const em = document.getElementById('login-email').value;
  if (em) document.getElementById('reset-email').value = em;
}
function mostrarPanelLogin() {
  document.getElementById('panel-reset').style.display = 'none';
  document.getElementById('panel-login').style.display = 'block';
}
async function enviarResetEmail() {
  const email = document.getElementById('reset-email').value.trim();
  const msg   = document.getElementById('reset-msg');
  if (!email) { msg.style.cssText='display:block;background:rgba(255,60,172,.1);border:1px solid rgba(255,60,172,.2);color:var(--a2);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;'; msg.textContent='⚠️ Introduce tu email'; return; }
  try { await supabase.auth.resetPasswordForEmail(email, { redirectTo:'https://connect.inout-media.es' }); } catch(e) {}
  msg.style.cssText='display:block;background:rgba(200,255,0,.08);border:1px solid rgba(200,255,0,.2);color:var(--a1);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;';
  msg.textContent='✅ Si el email está registrado, recibirás un enlace en tu bandeja de entrada.';
}

// ── GUARDAR NUEVA CONTRASEÑA (desde email de recovery) ──
async function guardarNuevaPassword() {
  const np  = document.getElementById('nueva-pass').value;
  const npc = document.getElementById('nueva-pass-confirm').value;
  const msg = document.getElementById('nueva-pass-msg');

  const showMsg = (txt, ok) => {
    msg.style.cssText = `display:block;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;background:${ok?'rgba(200,255,0,.08)':'rgba(255,60,172,.1)'};border:1px solid ${ok?'rgba(200,255,0,.2)':'rgba(255,60,172,.2)'};color:${ok?'var(--a1)':'var(--a2)'};`;
    msg.textContent = txt;
  };

  if (np !== npc)   { showMsg('⚠️ Las contraseñas no coinciden', false); return; }
  if (np.length < 6){ showMsg('⚠️ Mínimo 6 caracteres', false); return; }

  const btn = document.getElementById('nueva-pass-btn');
  btn.disabled = true; btn.textContent = 'Guardando…';

  const { error } = await supabase.auth.updateUser({ password: np });
  if (error) {
    showMsg('Error: ' + error.message, false);
    btn.disabled = false; btn.textContent = 'Guardar contraseña';
    return;
  }

  showMsg('✅ Contraseña actualizada. Redirigiendo…', true);
  window._recoveryMode = false;
  setTimeout(async () => {
    // Entrar a la app con la nueva sesión
    await checkSession(enterApp, () => {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('panel-nueva-pass').style.display = 'none';
      document.getElementById('panel-login').style.display = 'block';
    });
  }, 1500);
}

// ── AUTO-LOGIN ──
;(async function() {
  // Detectar recovery token en el hash (viene del redirect de Supabase)
  const hash = window.location.hash;
  const isRecovery = hash.includes('type=recovery') && hash.includes('access_token');

  if (isRecovery) {
    window._recoveryMode = true; // bloquear hashchange

    const params  = new URLSearchParams(hash.replace('#', ''));
    const token   = params.get('access_token');
    const refresh = params.get('refresh_token');

    if (token && refresh) {
      await supabase.auth.setSession({ access_token: token, refresh_token: refresh });
    }

    // Limpiar hash sin recargar ni disparar hashchange
    history.replaceState(null, '', window.location.pathname);

    // Mostrar panel de nueva contraseña
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('panel-login').style.display = 'none';
    document.getElementById('panel-reset').style.display = 'none';
    document.getElementById('panel-nueva-pass').style.display = 'block';
    return;
  }

  // También capturar via onAuthStateChange por si el token llega tarde
  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      window._recoveryMode = true;
      history.replaceState(null, '', window.location.pathname);
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('panel-login').style.display = 'none';
      document.getElementById('panel-reset').style.display = 'none';
      document.getElementById('panel-nueva-pass').style.display = 'block';
    }
  });

  await checkSession(enterApp, () => {
    document.getElementById('login-screen').style.display = 'flex';
  });
})();

initModal();
window.addEventListener('hashchange', () => {
  if (window._recoveryMode) return; // bloquear durante recovery
  const h = window.location.hash.replace('#','');
  if (h && h !== 'dashboard' && userProfile) irA(h);
});
</script>
