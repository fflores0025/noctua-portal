<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>InOut Media · Galería</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg:#07070f; --surf:#0d0d1a; --card:#111120; --border:#1c1c2e;
      --a1:#c8ff00; --a2:#ff3cac; --a3:#00d4ff;
      --txt:#e6e6f0; --muted:#60607a; --r:13px; --sidebar:240px;
    }
    html,body { height:100%; font-family:'DM Sans',sans-serif; font-size:14px; color:var(--txt); background:var(--bg); overflow-x:hidden; }
    ::-webkit-scrollbar { width:4px; height:4px; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
    #app { display:flex; min-height:100vh; }
    .sidebar { width:var(--sidebar); height:100vh; background:var(--surf); border-right:1px solid var(--border); display:flex; flex-direction:column; position:fixed; top:0; left:0; z-index:200; transition:transform .25s cubic-bezier(.4,0,.2,1); overflow:hidden; }
    .main-area { margin-left:var(--sidebar); flex:1; display:flex; flex-direction:column; min-height:100vh; }
    .topbar { height:56px; background:var(--surf); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 16px; gap:12px; position:sticky; top:0; z-index:100; }
    .main-content { flex:1; padding:28px 24px; max-width:1200px; width:100%; margin:0 auto; }
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:150; }
    .overlay.show { display:block; }
    .s-logo { padding:20px 20px 16px; border-bottom:1px solid var(--border); font-family:'Syne',sans-serif; font-weight:800; font-size:19px; letter-spacing:-.5px; display:flex; align-items:center; justify-content:space-between; }
    .s-logo-close { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:4px; line-height:1; }
    .s-logo-close:hover { color:var(--txt); }
    .logo-dot { color:var(--a1); }
    .s-user { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
    .avatar { width:36px; height:36px; border-radius:50%; background:var(--a1); color:#000; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; flex-shrink:0; }
    .u-name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .u-role { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
    .nav { flex:1; padding:8px 0; overflow-y:auto; }
    .nav-sec { padding:10px 20px 4px; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:600; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:9px 20px; cursor:pointer; color:var(--muted); transition:all .15s; font-size:13px; border-left:2px solid transparent; }
    .nav-item:hover { color:var(--txt); background:rgba(255,255,255,.03); }
    .nav-item.active { color:var(--a1); border-left-color:var(--a1); background:rgba(200,255,0,.05); }
    .nav-icon { font-size:15px; width:20px; text-align:center; flex-shrink:0; }
    .s-bottom { padding:14px 20px; border-top:1px solid var(--border); }
    .btn-logout { width:100%; padding:9px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; font-family:'DM Sans',sans-serif; font-size:13px; transition:all .15s; }
    .btn-logout:hover { border-color:var(--a2); color:var(--a2); }
    .burger { background:none; border:none; color:var(--txt); font-size:20px; cursor:pointer; padding:4px; display:none; }
    .topbar-title { font-family:'Syne',sans-serif; font-weight:700; font-size:15px; }
    .topbar-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
    .page-hd { margin-bottom:24px; display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    .page-title { font-family:'Syne',sans-serif; font-size:24px; font-weight:700; letter-spacing:-.5px; }
    .page-sub { color:var(--muted); font-size:13px; margin-top:3px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:20px; }
    .card-title { font-family:'Syne',sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:14px; }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:9px; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; transition:all .15s; white-space:nowrap; }
    .btn-p { background:var(--a1); color:#000; } .btn-p:hover { background:#d4ff20; }
    .btn-g { background:transparent; color:var(--muted); border:1px solid var(--border); } .btn-g:hover { color:var(--txt); border-color:var(--muted); }
    .btn-danger { background:rgba(255,60,172,.1); color:var(--a2); border:1px solid rgba(255,60,172,.2); }
    .btn-full { width:100%; justify-content:center; }
    .badge { display:inline-flex; align-items:center; padding:3px 8px; border-radius:20px; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.5px; }
    .b-green { background:rgba(200,255,0,.12); color:var(--a1); }
    .b-pink { background:rgba(255,60,172,.12); color:var(--a2); }
    .b-blue { background:rgba(0,212,255,.12); color:var(--a3); }
    .b-gray { background:rgba(107,107,136,.15); color:var(--muted); }
    .form-lbl { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; display:block; }
    .form-input, .form-select, .form-textarea { width:100%; padding:10px 14px; background:var(--bg); border:1px solid var(--border); border-radius:9px; color:var(--txt); font-family:'DM Sans',sans-serif; font-size:14px; outline:none; transition:border-color .15s; margin-bottom:14px; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color:var(--a1); }
    .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:500; align-items:center; justify-content:center; padding:16px; }
    .modal-bg.show { display:flex; }
    .modal { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:28px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; }
    .modal-title { font-family:'Syne',sans-serif; font-size:18px; font-weight:700; margin-bottom:20px; }
    .modal-close { float:right; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; line-height:1; margin-top:-4px; }
    .modal-close:hover { color:var(--a2); }
    #login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); background-image:radial-gradient(ellipse 60% 40% at 50% -5%,rgba(200,255,0,.09) 0%,transparent 65%); }
    .login-card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:36px 32px; }
    .login-logo { font-family:'Syne',sans-serif; font-weight:800; font-size:26px; margin-bottom:6px; }
    .login-sub { color:var(--muted); font-size:13px; margin-bottom:28px; }
    #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 20px; font-size:13px; z-index:1000; transition:transform .3s; white-space:nowrap; }
    #toast.show { transform:translateX(-50%) translateY(0); }

    /* ── TABS ── */
    .tabs { display:flex; gap:4px; background:var(--surf); border:1px solid var(--border); border-radius:10px; padding:4px; margin-bottom:24px; }
    .tab { flex:1; padding:9px 16px; border-radius:8px; border:none; background:transparent; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; transition:all .15s; text-align:center; }
    .tab.active { background:var(--a1); color:#000; }

    /* ── FILTRO EVENTO ── */
    .event-filter { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
    .event-filter select { padding:8px 12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--txt); font-family:'DM Sans',sans-serif; font-size:13px; outline:none; }
    .event-filter select:focus { border-color:var(--a1); }

    /* ── DROP ZONE ── */
    .drop-zone { border:2px dashed var(--border); border-radius:var(--r); padding:40px 20px; text-align:center; cursor:pointer; transition:all .2s; background:var(--bg); margin-bottom:20px; }
    .drop-zone:hover, .drop-zone.dragover { border-color:var(--a1); background:rgba(200,255,0,.04); }
    .drop-zone-icon { font-size:40px; margin-bottom:12px; }
    .drop-zone-txt { color:var(--muted); font-size:13px; }
    .drop-zone-txt strong { color:var(--a1); }
    #file-input { display:none; }

    /* ── PREVIEW GRID ── */
    .preview-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; margin-bottom:16px; }
    .preview-item { position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; border:1px solid var(--border); }
    .preview-item img { width:100%; height:100%; object-fit:cover; }
    .preview-remove { position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%; background:rgba(255,60,172,.9); border:none; color:#fff; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1; }

    /* ── PHOTO GRID ── */
    .photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
    .photo-card { background:var(--card); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; transition:all .2s; }
    .photo-card:hover { border-color:rgba(200,255,0,.25); transform:translateY(-2px); }
    .photo-thumb { aspect-ratio:4/3; overflow:hidden; position:relative; background:var(--bg); cursor:pointer; }
    .photo-thumb img { width:100%; height:100%; object-fit:cover; transition:transform .3s; }
    .photo-thumb:hover img { transform:scale(1.05); }
    .photo-thumb .premium-badge { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.7); backdrop-filter:blur(4px); padding:3px 8px; border-radius:20px; font-size:10px; color:var(--a1); font-weight:600; border:1px solid rgba(200,255,0,.3); }
    .photo-info { padding:10px 12px; }
    .photo-caption { font-size:12px; color:var(--muted); margin-bottom:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:16px; }
    .photo-actions { display:flex; gap:6px; align-items:center; }
    .photo-actions button { padding:4px 8px; font-size:11px; }
    .photo-toggle { padding:4px 8px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:11px; cursor:pointer; transition:all .15s; }
    .photo-toggle.premium { border-color:rgba(200,255,0,.3); color:var(--a1); background:rgba(200,255,0,.08); }
    .photo-toggle:hover { border-color:var(--a1); color:var(--a1); }

    /* ── LIGHTBOX ── */
    .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:900; align-items:center; justify-content:center; }
    .lightbox.show { display:flex; }
    .lightbox-img { max-width:90vw; max-height:85vh; object-fit:contain; border-radius:8px; }
    .lightbox-close { position:absolute; top:20px; right:20px; background:rgba(255,255,255,.1); border:none; color:#fff; font-size:24px; cursor:pointer; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
    .lightbox-close:hover { background:rgba(255,60,172,.3); }

    /* ── UPLOAD PROGRESS ── */
    .upload-progress { background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:12px 16px; margin-bottom:12px; }
    .progress-name { font-size:12px; margin-bottom:6px; display:flex; justify-content:space-between; }
    .progress-bar { height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
    .progress-fill { height:100%; background:var(--a1); border-radius:2px; transition:width .3s; }

    /* ── EMPTY STATE ── */
    .empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
    .empty-state-icon { font-size:48px; margin-bottom:16px; opacity:.4; }
    .empty-state-txt { font-size:14px; margin-bottom:20px; }

    @media(max-width:768px){
      :root { --sidebar:100vw; }
      .sidebar { width:100vw; transform:translateX(-100%); position:fixed; z-index:300; overflow-y:auto; }
      .sidebar.open { transform:translateX(0); }
      .main-area { margin-left:0; }
      .burger { display:flex!important; }
      .main-content { padding:16px 12px; }
      .photo-grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
      .preview-grid { grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); }
      .modal { padding:20px; }
    }
    @media(max-width:480px){
      .main-content { padding:12px 10px; }
      .modal { max-height:92vh; padding:18px; border-radius:16px 16px 0 0; position:fixed; bottom:0; left:0; right:0; width:100%; max-width:100%; }
      .modal-bg.show { align-items:flex-end; padding:0; }
      .photo-grid { grid-template-columns:repeat(2,1fr); }
    }
  </style>
</head>
<body>
<div id="toast"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">InOut<span class="logo-dot">.</span></div>
    <div class="login-sub">Galería · Portal del equipo</div>
    <div id="login-error" style="display:none;background:rgba(255,60,172,.1);border:1px solid rgba(255,60,172,.2);color:var(--a2);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;"></div>
    <label class="form-lbl">Email</label>
    <input class="form-input" id="login-email" type="email" placeholder="tu@inoutmedia.es"/>
    <label class="form-lbl">Contraseña</label>
    <input class="form-input" id="login-pass" type="password" placeholder="••••••••"/>
    <button class="btn btn-p btn-full" id="login-btn" onclick="doLogin()" style="font-size:15px;padding:12px">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="s-logo">
      <span>InOut<span class="logo-dot">.</span></span>
      <button class="s-logo-close" onclick="closeSidebar()">✕</button>
    </div>
    <div class="s-user">
      <div class="avatar" id="s-avatar">--</div>
      <div style="flex:1;min-width:0">
        <div class="u-name" id="s-name">—</div>
        <div class="u-role" id="s-role">—</div>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-sec">Navegación</div>
      <div class="nav-item" onclick="goTo('index.html')"><span class="nav-icon">⚡</span> Inicio</div>
      <div class="nav-item" onclick="goTo('index.html#eventos')"><span class="nav-icon">🎪</span> Eventos</div>
      <div class="nav-item active"><span class="nav-icon">🖼️</span> Galería</div>
    </nav>
    <div class="s-bottom">
      <button class="btn-logout" onclick="doLogout()">Cerrar sesión</button>
    </div>
  </aside>

  <div class="main-area">
    <div class="topbar">
      <button class="burger" id="burger-btn" onclick="toggleSidebar()">☰</button>
      <span class="topbar-title">Galería de Fotos</span>
      <div class="topbar-right">
        <a href="index.html" style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--txt);font-size:12px;text-decoration:none;transition:border-color .15s" onmouseover="this.style.borderColor='var(--a3)'" onmouseout="this.style.borderColor='var(--border)'">← Portal</a>
        <div class="avatar" id="tb-avatar" style="width:32px;height:32px;font-size:11px">--</div>
      </div>
    </div>

    <div class="main-content">
      <div class="page-hd">
        <div>
          <div class="page-title">🖼️ Galería</div>
          <div class="page-sub">Gestiona las fotos de eventos y de la organización</div>
        </div>
        <button class="btn btn-p" onclick="abrirModalSubida()">+ Subir fotos</button>
      </div>

      <!-- TABS -->
      <div class="tabs">
        <button class="tab active" id="tab-eventos" onclick="cambiarTab('eventos')">🎪 Por evento</button>
        <button class="tab" id="tab-org" onclick="cambiarTab('org')">🏢 De la organización</button>
      </div>

      <!-- PANEL EVENTOS -->
      <div id="panel-eventos">
        <div class="event-filter">
          <select id="filter-evento" onchange="cargarFotosEvento()" style="min-width:220px">
            <option value="">Cargando eventos…</option>
          </select>
          <span id="foto-count" style="font-size:12px;color:var(--muted)"></span>
        </div>
        <div id="fotos-evento-grid">
          <div class="empty-state"><div class="empty-state-icon">🎪</div><div class="empty-state-txt">Selecciona un evento</div></div>
        </div>
      </div>

      <!-- PANEL ORG -->
      <div id="panel-org" style="display:none">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <span id="org-foto-count" style="font-size:12px;color:var(--muted)"></span>
        </div>
        <div id="fotos-org-grid">
          <div class="empty-state"><div class="empty-state-icon">🏢</div><div class="empty-state-txt">Sin fotos de la organización aún</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL SUBIDA -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-body"></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="cerrarLightbox()">
  <button class="lightbox-close" onclick="cerrarLightbox()">✕</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt=""/>
</div>

<script>
// ── CONFIG ──
const SUPABASE_URL = 'https://raoxkjnwrccoxjcipfpv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhb3hram53cmNjb3hqY2lwZnB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyMzMxNzgsImV4cCI6MjA5MTgwOTE3OH0.dlPG4hpA-ypmGkqrP0ohaiOfMtXq5dpVmV7QNOt7_Qs';
const CLOUDINARY_CLOUD = 'dguxrlcaj';
const CLOUDINARY_PRESET = 'inout_media';
const CLOUDINARY_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`;

var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null, userProfile = null;
let tabActual = 'eventos';
let filasParaSubir = []; // File[] pendientes de subir
let orgData = null; // datos de la org actual

// ── HELPERS ──
function toast(msg, ms=2800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

function initials(n) {
  return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function canUpload() {
  return ['org_admin','superadmin','manager'].includes(userProfile?.role);
}

function showModal(h) {
  document.getElementById('modal-body').innerHTML = h;
  document.getElementById('modal-bg').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('show');
  filasParaSubir = [];
}

document.getElementById('modal-bg').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-bg')) closeModal();
});

function goTo(url) { window.location.href = url; }

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ── AUTH ──
function setLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!email || !pass) { setLoginError('Introduce email y contraseña.'); return; }
  document.getElementById('login-btn').disabled = true;
  document.getElementById('login-btn').textContent = 'Entrando…';
  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    currentUser = data.user;
    const { data: perfil, error: perfilErr } = await supabase.from('empleados').select('*').eq('auth_user_id', currentUser.id).single();
    if (perfilErr || !perfil) throw new Error('Perfil no encontrado');
    if (!canUploadRole(perfil.role)) throw new Error('No tienes permisos para acceder a la galería');
    userProfile = {
      nombre: perfil.nombre,
      role: perfil.role,
      _id: perfil.id,
      organization_id: perfil.organization_id || null
    };
    await enterApp();
  } catch(e) {
    document.getElementById('login-btn').disabled = false;
    document.getElementById('login-btn').textContent = 'Entrar';
    const msgs = { 'Invalid login credentials': 'Email o contraseña incorrectos.' };
    setLoginError(msgs[e.message] || e.message);
  }
}

function canUploadRole(r) {
  return ['org_admin','superadmin','manager'].includes(r);
}

document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

async function doLogout() {
  await supabase.auth.signOut();
  currentUser = null; userProfile = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function enterApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  const ini = initials(userProfile.nombre);
  ['s-avatar','tb-avatar'].forEach(id => document.getElementById(id).textContent = ini);
  document.getElementById('s-name').textContent = userProfile.nombre;
  document.getElementById('s-role').textContent = userProfile.role;

  // Cargar org data (para watermark)
  if (userProfile.organization_id) {
    const { data: org } = await supabase.from('organizations').select('*').eq('id', userProfile.organization_id).maybeSingle();
    orgData = org;
    if (org?.color_primario) document.documentElement.style.setProperty('--a1', org.color_primario);
    if (org?.color_secundario) document.documentElement.style.setProperty('--a2', org.color_secundario);
  }

  await cargarEventosFiltro();
  await cargarFotosOrg();
}

// ── AUTO-LOGIN ──
;(async function checkSession() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session?.user) return;
  currentUser = session.user;
  const { data: perfil } = await supabase.from('empleados').select('*').eq('auth_user_id', currentUser.id).maybeSingle();
  if (!perfil || !canUploadRole(perfil.role)) return;
  userProfile = {
    nombre: perfil.nombre,
    role: perfil.role,
    _id: perfil.id,
    organization_id: perfil.organization_id || null
  };
  await enterApp();
})();

// ── TABS ──
function cambiarTab(tab) {
  tabActual = tab;
  document.getElementById('tab-eventos').classList.toggle('active', tab === 'eventos');
  document.getElementById('tab-org').classList.toggle('active', tab === 'org');
  document.getElementById('panel-eventos').style.display = tab === 'eventos' ? 'block' : 'none';
  document.getElementById('panel-org').style.display = tab === 'org' ? 'block' : 'none';
}

// ── CARGAR EVENTOS PARA FILTRO ──
async function cargarEventosFiltro() {
  let q = supabase.from('events').select('id, nombre, fecha_inicio').order('fecha_inicio', { ascending: false });
  if (userProfile.organization_id) q = q.eq('organization_id', userProfile.organization_id);
  const { data } = await q;
  const sel = document.getElementById('filter-evento');
  sel.innerHTML = `<option value="">— Selecciona un evento —</option>` +
    (data || []).map(e => `<option value="${e.id}">${e.nombre} · ${(e.fecha_inicio||'').slice(0,10)}</option>`).join('');
}

// ── CARGAR FOTOS DE EVENTO ──
async function cargarFotosEvento() {
  const eventId = document.getElementById('filter-evento').value;
  const grid = document.getElementById('fotos-evento-grid');
  if (!eventId) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🎪</div><div class="empty-state-txt">Selecciona un evento</div></div>`;
    document.getElementById('foto-count').textContent = '';
    return;
  }
  grid.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:20px">Cargando…</div>`;
  const { data } = await supabase.from('event_photos').select('*').eq('event_id', eventId).order('created_at', { ascending: false });
  const fotos = data || [];
  document.getElementById('foto-count').textContent = `${fotos.length} foto${fotos.length!==1?'s':''}`;
  if (fotos.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📷</div><div class="empty-state-txt">Sin fotos para este evento.<br><span style="color:var(--a1);cursor:pointer" onclick="abrirModalSubida()">Subir las primeras →</span></div></div>`;
    return;
  }
  grid.innerHTML = `<div class="photo-grid">${fotos.map(f => fotoCard(f, 'evento')).join('')}</div>`;
}

// ── CARGAR FOTOS DE ORG ──
async function cargarFotosOrg() {
  const grid = document.getElementById('fotos-org-grid');
  grid.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:20px">Cargando…</div>`;
  let q = supabase.from('org_photos').select('*').order('created_at', { ascending: false });
  if (userProfile.organization_id) q = q.eq('organization_id', userProfile.organization_id);
  const { data } = await q;
  const fotos = data || [];
  document.getElementById('org-foto-count').textContent = `${fotos.length} foto${fotos.length!==1?'s':''}`;
  if (fotos.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🏢</div><div class="empty-state-txt">Sin fotos de la organización.<br><span style="color:var(--a1);cursor:pointer" onclick="abrirModalSubida()">Subir las primeras →</span></div></div>`;
    return;
  }
  grid.innerHTML = `<div class="photo-grid">${fotos.map(f => fotoCard(f, 'org')).join('')}</div>`;
}

// ── CARD DE FOTO ──
function fotoCard(f, tipo) {
  const thumb = f.thumbnail_url || f.url.replace('/upload/', '/upload/w_400,q_auto,f_auto/');
  return `
    <div class="photo-card" id="photo-${f.id}">
      <div class="photo-thumb" onclick="abrirLightbox('${f.url}')">
        <img src="${thumb}" alt="${f.caption||''}" loading="lazy"/>
        ${f.is_premium ? `<div class="premium-badge">⭐ Premium</div>` : ''}
      </div>
      <div class="photo-info">
        <div class="photo-caption">${f.caption || 'Sin descripción'}</div>
        <div class="photo-actions">
          <button class="photo-toggle ${f.is_premium?'premium':''}" onclick="togglePremium('${f.id}',${f.is_premium},'${tipo}')" title="${f.is_premium?'Quitar premium':'Marcar premium'}">
            ${f.is_premium ? '⭐ Premium' : '☆ Gratis'}
          </button>
          <button class="btn btn-danger" style="padding:4px 8px;font-size:11px;margin-left:auto" onclick="eliminarFoto('${f.id}','${tipo}')">🗑</button>
        </div>
      </div>
    </div>`;
}

// ── TOGGLE PREMIUM ──
async function togglePremium(id, esPremium, tipo) {
  const tabla = tipo === 'evento' ? 'event_photos' : 'org_photos';
  const { error } = await supabase.from(tabla).update({ is_premium: !esPremium }).eq('id', id);
  if (error) { toast('Error: ' + error.message); return; }
  toast(esPremium ? 'Foto marcada como gratuita' : '⭐ Foto marcada como premium');
  if (tipo === 'evento') cargarFotosEvento();
  else cargarFotosOrg();
}

// ── ELIMINAR FOTO ──
async function eliminarFoto(id, tipo) {
  if (!confirm('¿Eliminar esta foto? Esta acción no se puede deshacer.')) return;
  const tabla = tipo === 'evento' ? 'event_photos' : 'org_photos';
  const { error } = await supabase.from(tabla).delete().eq('id', id);
  if (error) { toast('Error: ' + error.message); return; }
  toast('Foto eliminada ✓');
  if (tipo === 'evento') cargarFotosEvento();
  else cargarFotosOrg();
}

// ── LIGHTBOX ──
function abrirLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('show');
}
function cerrarLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lightbox-img').src = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarLightbox(); });

// ── MODAL SUBIDA ──
function abrirModalSubida() {
  const eventId = document.getElementById('filter-evento')?.value || '';
  const eventNombre = document.getElementById('filter-evento')?.selectedOptions[0]?.text || '';
  const esEventoTab = tabActual === 'eventos';

  // Cargar select de eventos para el modal
  supabase.from('events').select('id, nombre, fecha_inicio')
    .then(async ({ data: evts }) => {
      if (userProfile.organization_id) {
        // ya filtrado por RLS
      }
      const eventOpts = (evts || []).map(e =>
        `<option value="${e.id}" ${e.id===eventId?'selected':''}>${e.nombre} · ${(e.fecha_inicio||'').slice(0,10)}</option>`
      ).join('');

      showModal(`
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-title">📤 Subir fotos</div>

        <label class="form-lbl">Destino</label>
        <select class="form-select" id="upload-destino" onchange="toggleEventoSelect()">
          <option value="evento" ${esEventoTab?'selected':''}>🎪 Fotos de un evento</option>
          <option value="org" ${!esEventoTab?'selected':''}>🏢 Fotos de la organización</option>
        </select>

        <div id="upload-evento-wrap">
          <label class="form-lbl">Evento</label>
          <select class="form-select" id="upload-evento">
            <option value="">— Selecciona evento —</option>
            ${eventOpts}
          </select>
        </div>

        <label class="form-lbl">Descripción / pie de foto (opcional)</label>
        <input class="form-input" id="upload-caption" placeholder="Noche del sábado, booth principal…"/>

        <label class="form-lbl">Fotos</label>
        <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
          <div class="drop-zone-icon">📸</div>
          <div class="drop-zone-txt">Arrastra aquí o <strong>haz clic para seleccionar</strong><br><span style="font-size:11px;margin-top:4px;display:block">JPG, PNG, WEBP · Máx. 10MB por foto</span></div>
        </div>
        <input type="file" id="file-input" accept="image/*" multiple onchange="onFilesSelected(this.files)"/>

        <div id="preview-container" style="display:none">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <span style="font-size:12px;color:var(--muted)" id="preview-count"></span>
            <button class="btn btn-g" style="padding:4px 10px;font-size:11px" onclick="limpiarFiles()">✕ Limpiar</button>
          </div>
          <div class="preview-grid" id="preview-grid"></div>
        </div>

        <div id="progress-container"></div>

        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="btn btn-p btn-full" id="upload-btn" onclick="subirFotos()">Subir fotos</button>
          <button class="btn btn-g" onclick="closeModal()">Cancelar</button>
        </div>
      `);

      // Drag & drop
      const dz = document.getElementById('drop-zone');
      dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
      dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); onFilesSelected(e.dataTransfer.files); });

      toggleEventoSelect();
    });
}

function toggleEventoSelect() {
  const dest = document.getElementById('upload-destino')?.value;
  const wrap = document.getElementById('upload-evento-wrap');
  if (wrap) wrap.style.display = dest === 'evento' ? 'block' : 'none';
}

function onFilesSelected(fileList) {
  const nuevas = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  filasParaSubir = [...filasParaSubir, ...nuevas];
  renderPreview();
}

function renderPreview() {
  const container = document.getElementById('preview-container');
  const grid = document.getElementById('preview-grid');
  const count = document.getElementById('preview-count');
  if (!container || !grid) return;
  if (filasParaSubir.length === 0) { container.style.display = 'none'; return; }
  container.style.display = 'block';
  count.textContent = `${filasParaSubir.length} foto${filasParaSubir.length!==1?'s':''}`;
  grid.innerHTML = filasParaSubir.map((f, i) => {
    const url = URL.createObjectURL(f);
    return `<div class="preview-item">
      <img src="${url}" alt=""/>
      <button class="preview-remove" onclick="eliminarPreview(${i})">✕</button>
    </div>`;
  }).join('');
}

function eliminarPreview(i) {
  filasParaSubir.splice(i, 1);
  renderPreview();
}

function limpiarFiles() {
  filasParaSubir = [];
  renderPreview();
}

// ── SUBIR A CLOUDINARY + GUARDAR EN SUPABASE ──
async function subirFotos() {
  if (filasParaSubir.length === 0) { toast('⚠️ Selecciona al menos una foto'); return; }

  const destino = document.getElementById('upload-destino').value;
  const eventId = destino === 'evento' ? document.getElementById('upload-evento').value : null;
  if (destino === 'evento' && !eventId) { toast('⚠️ Selecciona un evento'); return; }

  const caption = document.getElementById('upload-caption').value.trim();
  const btn = document.getElementById('upload-btn');
  btn.disabled = true; btn.textContent = 'Subiendo…';

  const progressContainer = document.getElementById('progress-container');
  progressContainer.innerHTML = '';

  let ok = 0, fail = 0;

  for (let i = 0; i < filasParaSubir.length; i++) {
    const file = filasParaSubir[i];

    // Barra de progreso individual
    const progId = `prog-${i}`;
    progressContainer.innerHTML += `
      <div class="upload-progress" id="${progId}">
        <div class="progress-name"><span>${file.name}</span><span id="${progId}-pct">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="${progId}-fill" style="width:0%"></div></div>
      </div>`;

    try {
      // Subir a Cloudinary
      const fd = new FormData();
      fd.append('file', file);
      fd.append('upload_preset', CLOUDINARY_PRESET);
      fd.append('folder', `inout/${userProfile.organization_id || 'global'}/${destino === 'evento' ? 'eventos/' + eventId : 'org'}`);

      const xhr = new XMLHttpRequest();
      const url = await new Promise((resolve, reject) => {
        xhr.open('POST', CLOUDINARY_UPLOAD_URL);
        xhr.upload.onprogress = e => {
          if (e.lengthComputable) {
            const pct = Math.round(e.loaded / e.total * 100);
            const fill = document.getElementById(`${progId}-fill`);
            const pctEl = document.getElementById(`${progId}-pct`);
            if (fill) fill.style.width = pct + '%';
            if (pctEl) pctEl.textContent = pct + '%';
          }
        };
        xhr.onload = () => {
          if (xhr.status === 200) {
            const res = JSON.parse(xhr.responseText);
            resolve(res.secure_url);
          } else {
            reject(new Error('Upload failed'));
          }
        };
        xhr.onerror = () => reject(new Error('Network error'));
        xhr.send(fd);
      });

      // Thumbnail automático via Cloudinary transform
      const thumbUrl = url.replace('/upload/', '/upload/w_400,h_400,c_fill,q_auto,f_auto/');

      // Guardar en Supabase
      const tabla = destino === 'evento' ? 'event_photos' : 'org_photos';
      const payload = {
        url,
        thumbnail_url: thumbUrl,
        caption: caption || null,
        is_premium: false,
        uploaded_by: userProfile._id,
        organization_id: userProfile.organization_id
      };
      if (destino === 'evento') payload.event_id = eventId;

      await supabase.from(tabla).insert(payload);
      ok++;

      // Marcar como completado
      const progEl = document.getElementById(progId);
      if (progEl) progEl.style.borderColor = 'rgba(200,255,0,.3)';

    } catch(e) {
      fail++;
      const progEl = document.getElementById(progId);
      if (progEl) progEl.style.borderColor = 'rgba(255,60,172,.3)';
    }
  }

  btn.disabled = false; btn.textContent = 'Subir fotos';
  toast(fail === 0 ? `✅ ${ok} foto${ok!==1?'s':''} subida${ok!==1?'s':''}` : `⚠️ ${ok} ok · ${fail} error${fail!==1?'es':''}`);

  closeModal();

  // Recargar la pestaña correspondiente
  if (destino === 'evento') {
    if (document.getElementById('filter-evento')) {
      document.getElementById('filter-evento').value = eventId;
      cargarFotosEvento();
    }
    cambiarTab('eventos');
  } else {
    cargarFotosOrg();
    cambiarTab('org');
  }
}
</script>
