<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>InOut Media · Connect</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg:#07070f; --surf:#0d0d1a; --card:#111120; --border:#1c1c2e;
      --a1:#c8ff00; --a2:#ff3cac; --a3:#00d4ff;
      --txt:#e6e6f0; --muted:#60607a; --r:13px; --sidebar:240px;
    }
    html,body { height:100%; font-family:'DM Sans',sans-serif; font-size:14px; color:var(--txt); background:var(--bg); overflow-x:hidden; }
    ::-webkit-scrollbar { width:4px; height:4px; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
    #app { display:flex; min-height:100vh; }
    .sidebar { width:var(--sidebar); height:100vh; background:var(--surf); border-right:1px solid var(--border); display:flex; flex-direction:column; position:fixed; top:0; left:0; z-index:200; transition:transform .25s cubic-bezier(.4,0,.2,1); overflow:hidden; }
    .main-area { margin-left:var(--sidebar); flex:1; display:flex; flex-direction:column; min-height:100vh; }
    .topbar { height:56px; background:var(--surf); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 16px; gap:12px; position:sticky; top:0; z-index:100; }
    @media(max-width:480px){ .topbar{height:52px;padding:0 12px;} }
    .main-content { flex:1; padding:28px 24px; max-width:1100px; width:100%; margin:0 auto; }
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:150; }
    .overlay.show { display:block; }
    .s-logo { padding:20px 20px 16px; border-bottom:1px solid var(--border); font-family:'Syne',sans-serif; font-weight:800; font-size:19px; letter-spacing:-.5px; display:flex; align-items:center; justify-content:space-between; }
    .s-logo-close { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:4px; line-height:1; }
    .s-logo-close:hover { color:var(--txt); }
    .logo-dot { color:var(--a1); }
    .s-user { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; cursor:pointer; transition:background .15s; }
    .s-user:hover { background:rgba(255,255,255,.04); }
    .s-user-arrow { margin-left:auto; color:var(--muted); font-size:14px; transition:all .2s; }
    .s-user:hover .s-user-arrow { color:var(--a1); transform:translateX(2px); }
    .avatar { width:36px; height:36px; border-radius:50%; background:var(--a1); color:#000; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; flex-shrink:0; }
    .av-pink{background:var(--a2);color:#fff;} .av-blue{background:var(--a3);color:#000;} .av-gray{background:var(--muted);color:#fff;}
    .u-name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .u-role { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
    .nav { flex:1; padding:8px 0; overflow-y:auto; min-height:0; }
    .nav-sec { padding:10px 20px 4px; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:600; }
    .nav-item { display:flex; align-items:center; gap:10px; padding:9px 20px; cursor:pointer; color:var(--muted); transition:all .15s; font-size:13px; border-left:2px solid transparent; user-select:none; }
    .nav-item:hover { color:var(--txt); background:rgba(255,255,255,.03); }
    .nav-item.active { color:var(--a1); border-left-color:var(--a1); background:rgba(200,255,0,.05); }
    .nav-icon { font-size:15px; width:20px; text-align:center; flex-shrink:0; }
    .nav-badge { background:var(--a2); color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:10px; margin-left:auto; line-height:1.4; }
    .s-bottom { padding:14px 20px; border-top:1px solid var(--border); flex-shrink:0; }
    .btn-logout { width:100%; padding:9px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; font-family:'DM Sans',sans-serif; font-size:13px; transition:all .15s; }
    .btn-logout:hover { border-color:var(--a2); color:var(--a2); }
    .burger { background:none; border:none; color:var(--txt); font-size:20px; cursor:pointer; padding:4px; display:none; }
    .topbar-title { font-family:'Syne',sans-serif; font-weight:700; font-size:15px; }
    .topbar-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
    .notif-btn { width:34px; height:34px; border-radius:50%; background:var(--card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; transition:border-color .15s; }
    .notif-btn:hover { border-color:var(--a1); }
    .page-hd { margin-bottom:24px; display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    .page-title { font-family:'Syne',sans-serif; font-size:24px; font-weight:700; letter-spacing:-.5px; }
    .page-sub { color:var(--muted); font-size:13px; margin-top:3px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:20px; }
    .card-title { font-family:'Syne',sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:14px; }
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;} .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;} .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;} .g-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
    .mb16{margin-bottom:16px;} .mb24{margin-bottom:24px;} .flex{display:flex;} .items-c{align-items:center;} .j-between{justify-content:space-between;}
    .stat { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:18px 20px; }
    .stat-lbl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
    .stat-val { font-family:'Syne',sans-serif; font-size:26px; font-weight:700; letter-spacing:-1px; }
    .stat-note { font-size:12px; color:var(--muted); margin-top:4px; }
    .c-a1{color:var(--a1);} .c-a2{color:var(--a2);} .c-a3{color:var(--a3);}
    .badge { display:inline-flex; align-items:center; padding:3px 8px; border-radius:20px; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.5px; }
    .b-green{background:rgba(200,255,0,.12);color:var(--a1);} .b-pink{background:rgba(255,60,172,.12);color:var(--a2);} .b-blue{background:rgba(0,212,255,.12);color:var(--a3);} .b-gray{background:rgba(107,107,136,.15);color:var(--muted);} .b-orange{background:rgba(255,165,0,.12);color:#ffa500;}
    .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px;}
    .tbl-wrap::-webkit-scrollbar{height:3px;}
    .tbl-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
    table{width:100%;border-collapse:collapse;}
    thead th{text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap;}
    tbody td{padding:12px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;}
    tbody tr:last-child td{border-bottom:none;}
    tbody tr:hover td{background:rgba(255,255,255,.02);}
    .nom-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:14px;}
    .nom-row:last-child{border-bottom:none;}
    .nom-total{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;color:var(--a1);}
    .irpf-big{font-family:'Syne',sans-serif;font-size:56px;font-weight:800;color:var(--a1);text-align:center;line-height:1;}
    input[type=range]{width:100%;accent-color:var(--a1);cursor:pointer;height:4px;}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap;}
    .btn-p{background:var(--a1);color:#000;} .btn-p:hover{background:#d4ff20;}
    .btn-g{background:transparent;color:var(--muted);border:1px solid var(--border);} .btn-g:hover{color:var(--txt);border-color:var(--muted);}
    .btn-danger{background:rgba(255,60,172,.1);color:var(--a2);border:1px solid rgba(255,60,172,.2);}
    .btn-full{width:100%;justify-content:center;}
    .btn-paid{background:rgba(0,230,118,.1);color:#00e676;border:1px solid rgba(0,230,118,.25);}
    .btn-paid:hover{background:rgba(0,230,118,.2);}
    .info-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px;}
    .info-row:last-child{border-bottom:none;}
    .info-lbl{color:var(--muted);font-size:13px;}
    .form-lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block;}
    .form-input,.form-select,.form-textarea{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .15s;margin-bottom:14px;}
    .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--a1);}
    .form-textarea{resize:vertical;min-height:80px;}
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:center;justify-content:center;padding:16px;}
    .modal-bg.show{display:flex;}
    .modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:28px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;}
    .modal-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:20px;}
    .modal-close{float:right;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;margin-top:-4px;}
    .modal-close:hover{color:var(--a2);}
    #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);background-image:radial-gradient(ellipse 60% 40% at 50% -5%,rgba(200,255,0,.09) 0%,transparent 65%),radial-gradient(ellipse 40% 30% at 85% 85%,rgba(255,60,172,.07) 0%,transparent 55%);}
    .login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:36px 32px;}
    .login-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;margin-bottom:6px;}
    .login-sub{color:var(--muted);font-size:13px;margin-bottom:28px;line-height:1.4;}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;z-index:1000;transition:transform .3s;white-space:nowrap;}
    #toast.show{transform:translateX(-50%) translateY(0);}
    @media(max-width:768px){
      :root{--sidebar:100vw;}
      .sidebar{width:100vw;transform:translateX(-100%);position:fixed;top:0;left:0;height:100vh;z-index:300;overflow-y:auto;display:flex;flex-direction:column;}
      .sidebar.open{transform:translateX(0);box-shadow:none;}
      .main-area{margin-left:0;}
      .burger{display:flex!important;}
      .main-content{padding:16px 12px;}
      .g4{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:1fr 1fr;} .g2{grid-template-columns:1fr;}
      .g-auto{grid-template-columns:1fr;}
      .page-title{font-size:20px;} .irpf-big{font-size:40px;} .nom-total{font-size:20px;}
      .page-hd{margin-bottom:16px;flex-wrap:wrap;gap:10px;}
      .page-hd .btn{width:100%;justify-content:center;}
      .card{padding:16px;}
      .stat{padding:14px;}
      .stat-val{font-size:22px;}
      .btn{padding:10px 14px;font-size:14px;}
      .modal{padding:20px;}
      .tbl-wrap{border-radius:8px;}
      thead th{font-size:10px;padding:6px 8px;}
      tbody td{padding:10px 8px;font-size:12px;}
    }
    @media(max-width:480px){
      .g4{grid-template-columns:1fr 1fr;}
      .g3{grid-template-columns:1fr;}
      .topbar-title{font-size:14px;}
      .main-content{padding:12px 10px;}
      .page-title{font-size:18px;}
      .card{padding:14px;}
      .stat-val{font-size:20px;}
      .modal{max-height:92vh;padding:18px;border-radius:16px 16px 0 0;position:fixed;bottom:0;left:0;right:0;width:100%;max-width:100%;}
      .modal-bg.show{align-items:flex-end;padding:0;}
      .page-hd{flex-direction:column;align-items:stretch;}
      .page-hd .btn{width:100%;justify-content:center;padding:12px;font-size:14px;}
    }
    /* Estilos para el calendario */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.cal-hd {
  text-align: center;
  padding: 6px 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .5px;
}

.cal-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
  background: var(--bg);
  border: 1px solid var(--border);
  user-select: none;
  position: relative;
}

.cal-day:hover {
  border-color: var(--a3);
  background: rgba(0, 212, 255, .05);
}

.cal-day.empty {
  background: transparent;
  border-color: transparent;
  cursor: default;
  pointer-events: none;
}

.cal-day.today {
  border-color: var(--a1);
  color: var(--a1);
  font-weight: 700;
}

.cal-day.selected {
  background: rgba(200, 255, 0, .14);
  border-color: var(--a1);
  color: var(--a1);
}

.cal-day.has-event::after {
  content: '';
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--a2);
}

.cal-day.has-turno::after {
  content: '';
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--a3);
}

.cal-day.has-ausencia {
  background: rgba(200, 255, 0, .14) !important;
  border-color: var(--a1) !important;
  color: var(--a1) !important;
  font-weight: 600;
}

/* Estilos para el chat */
.chat-container {
  display: flex;
  flex-direction: column;
  height: 500px;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.chat-date-sep {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  margin: 12px 0;
}

.chat-bubble-wrap {
  display: flex;
  margin-bottom: 4px;
}

.chat-bubble-wrap.mine {
  justify-content: flex-end;
}

.chat-bubble {
  max-width: 70%;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
}

.chat-bubble.mine {
  background: rgba(200, 255, 0, .1);
  border-color: rgba(200, 255, 0, .2);
}

.chat-sender {
  font-size: 11px;
  color: var(--a3);
  margin-bottom: 4px;
  font-weight: 600;
}

.chat-meta {
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
  display: flex;
  gap: 8px;
  align-items: center;
}

.chat-dest {
  color: var(--a1);
}

.chat-input-bar {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid var(--border);
}

.chat-input-bar select {
  width: 140px;
  padding: 8px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--txt);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  outline: none;
}

.chat-input-bar input {
  flex: 1;
  padding: 8px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--txt);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  outline: none;
}

.chat-input-bar input:focus {
  border-color: var(--a1);
}

.chat-input-bar button {
  padding: 8px 16px;
  background: var(--a1);
  border: none;
  border-radius: 8px;
  color: #000;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}

.chat-input-bar button:hover {
  background: #d4ff20;
}
  </style>
</head>

<div id="toast"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div id="panel-login">
      <div class="login-logo">InOut<span class="logo-dot">.</span></div>
      <div class="login-sub">Portal del equipo · InOut Media</div>
      <div id="login-error" style="display:none;background:rgba(255,60,172,.1);border:1px solid rgba(255,60,172,.2);color:var(--a2);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;"></div>
      <label class="form-lbl">Email</label>
      <input class="form-input" id="login-email" type="email" placeholder="tu@inoutmedia.es" autocomplete="email"/>
      <label class="form-lbl">Contraseña</label>
      <input class="form-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password"/>
      <button class="btn btn-p btn-full" id="login-btn" onclick="doLogin()" style="font-size:15px;padding:12px">Entrar al portal</button>
      <div style="margin-top:10px;text-align:center">
        <span style="font-size:12px;color:var(--a3);cursor:pointer;text-decoration:underline" onclick="mostrarPanelReset()">¿Olvidaste tu contraseña?</span>
      </div>
    </div>
    <div id="panel-reset" style="display:none">
      <div class="login-logo">InOut<span class="logo-dot">.</span></div>
      <div class="login-sub" style="margin-bottom:20px">Recuperar contraseña</div>
      <div id="reset-msg" style="display:none;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;"></div>
      <label class="form-lbl">Tu email</label>
      <input class="form-input" id="reset-email" type="email" placeholder="tu@inoutmedia.es"/>
      <button class="btn btn-p btn-full" onclick="enviarResetEmail()" style="font-size:15px;padding:12px">Enviar enlace</button>
      <div style="margin-top:10px;text-align:center">
        <span style="font-size:12px;color:var(--a3);cursor:pointer;text-decoration:underline" onclick="mostrarPanelLogin()">← Volver al inicio de sesión</span>
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="s-logo">
      <span>InOut<span class="logo-dot">.</span></span>
      <button class="s-logo-close" onclick="closeSidebar()" title="Cerrar menú">✕</button>
    </div>
    <div class="s-user" onclick="navigate('perfil')" title="Ver mi perfil">
      <div class="avatar" id="s-avatar">--</div>
      <div style="flex:1;min-width:0">
        <div class="u-name" id="s-name">—</div>
        <div class="u-role" id="s-role">—</div>
      </div>
      <span class="s-user-arrow">›</span>
    </div>
    <nav class="nav" id="nav-items"></nav>
    <div class="s-bottom">
      <button class="btn-logout" onclick="doLogout()">Cerrar sesión</button>
    </div>
  </aside>
  <div class="main-area">
    <div class="topbar">
      <button class="burger" id="burger-btn" onclick="toggleSidebar()">☰</button>
      <span class="topbar-title" id="topbar-title">Portal</span>
      <div class="topbar-right">
        <a href="https://inout-valid.vercel.app" target="_blank" rel="noopener" title="Abrir RFID System" style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--txt);font-size:12px;text-decoration:none;transition:border-color .15s" onmouseover="this.style.borderColor='var(--a3)'" onmouseout="this.style.borderColor='var(--border)'">📡 <span>Valid</span></a>
        <div class="notif-btn" onclick="toast('Sin notificaciones nuevas')">🔔</div>
        <div class="avatar" id="tb-avatar" style="width:32px;height:32px;font-size:11px;cursor:pointer" onclick="navigate('perfil')">--</div>
      </div>
    </div>
    <div class="main-content" id="page-content"></div>

function setLoginError(msg){const el=document.getElementById("login-error");el.textContent=msg;el.style.display=msg?"block":"none";}
function setLoginLoading(on){document.getElementById("login-btn").disabled=on;document.getElementById("login-btn").textContent=on?"Entrando…":"Entrar al portal";}

async function doLogin(){
  const email=document.getElementById("login-email").value.trim();
  const pass=document.getElementById("login-pass").value;
  setLoginError("");
  if(!email||!pass){setLoginError("Introduce email y contraseña.");return;}
  setLoginLoading(true);
  try{
    const{data,error}=await _sb.auth.signInWithPassword({email,password:pass});
    if(error)throw error;
    currentUser=data.user;
    const{data:perfil,error:perfilErr}=await _sb.from('empleados').select('*').eq('auth_user_id',currentUser.id).single();
    if(perfilErr||!perfil){setLoginError("Perfil no encontrado. Contacta con el administrador.");await _sb.auth.signOut();setLoginLoading(false);return;}
    userProfile={nombre:perfil.nombre,role:perfil.role,dept:perfil.departamento||"—",email:perfil.email,irpf:parseFloat(perfil.irpf)||15,salarioBase:parseFloat(perfil.salario_base)||0,tipo:perfil.tipo||"fijo",tlf:perfil.telefono||"—",fechaAlta:perfil.fecha_alta||"—",estado:perfil.estado||"activo",_supabase_id:perfil.id,organization_id:perfil.organization_id||null,pin_desbloqueo:perfil.pin_desbloqueo||"",staff_pin:perfil.staff_pin||"",staff_uid:perfil.staff_uid||""};
    enterApp();
  }catch(e){
    setLoginLoading(false);
    const msgs={"Invalid login credentials":"Email o contraseña incorrectos.","Email not confirmed":"Confirma tu email primero."};
    setLoginError(msgs[e.message]||"Error al iniciar sesión: "+e.message);
  }
}

document.getElementById("login-pass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});

function mostrarPanelReset(){document.getElementById("panel-login").style.display="none";document.getElementById("panel-reset").style.display="block";document.getElementById("reset-msg").style.display="none";const emailLogin=document.getElementById("login-email").value;if(emailLogin)document.getElementById("reset-email").value=emailLogin;}
function mostrarPanelLogin(){document.getElementById("panel-reset").style.display="none";document.getElementById("panel-login").style.display="block";}

async function enviarResetEmail(){
  const email=document.getElementById("reset-email").value.trim();
  const msg=document.getElementById("reset-msg");
  if(!email){msg.style.display="block";msg.style.background="rgba(255,60,172,.1)";msg.style.border="1px solid rgba(255,60,172,.2)";msg.style.color="var(--a2)";msg.textContent="⚠️ Introduce tu email";return;}
  try{await _sb.auth.resetPasswordForEmail(email,{redirectTo:"https://connect.inout-media.es"});}catch(e){}
  msg.style.display="block";msg.style.background="rgba(200,255,0,.08)";msg.style.border="1px solid rgba(200,255,0,.2)";msg.style.color="var(--a1)";msg.textContent="✅ Si el email está registrado, recibirás un enlace en tu bandeja de entrada.";
}

async function doLogout(){
  await _sb.auth.signOut();currentUser=null;userProfile=null;
  document.getElementById("app").style.display="none";document.getElementById("login-screen").style.display="flex";
  document.getElementById("login-email").value="";document.getElementById("login-pass").value="";closeSidebar();
}

async function enterApp(){
  document.getElementById("login-screen").style.display="none";document.getElementById("app").style.display="flex";
  const ini=initials(userProfile.nombre),avc=avatarColor(userProfile.role);
  ["s-avatar","tb-avatar"].forEach(id=>{const el=document.getElementById(id);el.textContent=ini;el.className=`avatar ${avc}`;});
  document.getElementById("s-name").textContent=userProfile.nombre;document.getElementById("s-role").textContent=userProfile.role;
  buildNav(userProfile.role);
  await cargarEventos();await cargarMisNominas();await cargarMisTurnos();
  if(canAdminRole(userProfile.role)){await cargarEmpleados();await cargarTodosLosTurnos();}
  const hash=window.location.hash.replace('#','');navigate(hash||"dashboard");
}

async function cargarMisNominas(){try{const{data}=await _sb.from('nominas').select('*').eq('empleado_id',userProfile._supabase_id).order('created_at',{ascending:false});DEMO_NOMINAS=(data||[]).map(n=>({id:n.id,empleadoId:n.empleado_id,empleadoNombre:n.empleado_nombre,mes:n.mes,bruto:parseFloat(n.bruto),irpf:parseFloat(n.irpf),retencion:parseFloat(n.retencion),ss:parseFloat(n.ss),neto:parseFloat(n.neto),estado:n.estado,generadoPor:n.generado_por,fechaCreacion:n.created_at}));}catch(e){DEMO_NOMINAS=[];}}
async function cargarMisTurnos(){try{const{data}=await _sb.from('turnos').select('*').eq('empleado_id',userProfile._supabase_id).order('fecha');DEMO_TURNOS=(data||[]).map(t=>({id:t.id,empleadoId:t.empleado_id,empleadoNombre:t.empleado_nombre,fecha:t.fecha,tipo:t.tipo||"oficina",entrada:t.hora_inicio||"—",salida:t.hora_fin||"—",lugar:t.notas||"—"}));}catch(e){DEMO_TURNOS=[];}}
async function cargarTodosLosTurnos(){try{const{data}=await _sb.from('turnos').select('*').order('fecha');TURNOS_EQUIPO=(data||[]).map(t=>({id:t.id,empleadoId:t.empleado_id,empleadoNombre:t.empleado_nombre,fecha:t.fecha,tipo:t.tipo||"oficina",entrada:t.hora_inicio||"—",salida:t.hora_fin||"—",lugar:t.notas||"—"}));}catch(e){TURNOS_EQUIPO=[];}}
async function cargarEventos(){try{const{data}=await _sb.from('events').select('*').order('fecha_inicio',{ascending:false});DEMO_EVENTOS=(data||[]).map(e=>{const fi=e.fecha_inicio||"",ff=e.fecha_fin||"";return{id:e.id,nombre:e.nombre,fecha:fi.slice(0,10),hora_inicio:fi.slice(11,16),fecha_fin:ff?ff.slice(0,10):null,hora_fin:ff?ff.slice(11,16):"06:00",lugar:`${e.venue_nombre||""}${e.venue_ciudad?", "+e.venue_ciudad:""}`,tipo:e.tipo||"nocturno",estado:e.estado||"borrador",equipo:e.equipo||0,notas:e.notas||e.descripcion||"—",artistas:e.artistas||"",vestimenta:e.vestimenta||"",apertura:e.apertura_puertas||"",edadMinima:e.edad_minima||0,normas:e.normas||"",descripcionEvento:e.descripcion||"",mapsUrl:e.maps_url||"",webEvento:e.web_evento||""};})}catch(e){DEMO_EVENTOS=[];}}

async function cargarEmpleados(){
  try{
    let query=_sb.from('empleados').select('*');
    if(userProfile.role!=='superadmin' && userProfile.organization_id){
      query=query.eq('organization_id',userProfile.organization_id);
    }
    const{data}=await query;
    DEMO_EMPLEADOS=(data||[]).map(d=>({id:d.id,nombre:d.nombre||"—",email:d.email||"—",role:d.role||"empleado",dept:d.departamento||"—",tipo:d.tipo||"fijo",irpf:parseFloat(d.irpf)||15,salario:parseFloat(d.salario_base)||0,salarioBase:parseFloat(d.salario_base)||0,estado:d.estado||"activo",tlf:d.telefono||"—",fechaAlta:d.fecha_alta||"—",auth_user_id:d.auth_user_id,numero_empleado:d.numero_empleado||"—",staff_uid:d.staff_uid||"",staff_pin:d.staff_pin||"",horas_contrato:parseFloat(d.horas_contrato)||40}));
  }catch(e){DEMO_EMPLEADOS=[];}
}

function buildNav(role){
  const items=NAV_CONFIG[role]||NAV_CONFIG.empleado;
  document.getElementById("nav-items").innerHTML=items.map(i=>{
    if(i.sec)return`<div class="nav-sec">${i.sec}</div>`;
    const badgeHtml=i.key==="mensajes"&&unreadMsgCount>0?`<span class="nav-badge" id="nav-badge-msg">${unreadMsgCount}</span>`:"";
    return`<div class="nav-item" id="nav-${i.key}" onclick="navigate('${i.key}')"><span class="nav-icon">${i.icon}</span><span>${i.label}</span>${badgeHtml}</div>`;
  }).join("");
}

function navigate(page){
  const adminPages=["admin","admin-irpf","admin-nominas","admin-turnos"];
  if(adminPages.includes(page)&&!canAdmin()){toast("⛔ Sin acceso");page="dashboard";}
  const extPages=["dashboard","perfil","mensajes"];
  if(userProfile?.role==="empresa_externa"&&!extPages.includes(page)){toast("⛔ Sin acceso");page="dashboard";}
  currentPage=page;window.location.hash=page;
  document.querySelectorAll(".nav-item").forEach(el=>el.classList.remove("active"));
  document.getElementById(`nav-${page}`)?.classList.add("active");
  document.getElementById("topbar-title").textContent=PAGE_TITLE[page]||page;
  closeSidebar();
  const pc=document.getElementById("page-content");pc.scrollTop=0;
  
  // Router
  if(page==="dashboard") dashboard(pc);
  else if(page==="perfil") renderPerfil(pc);
  else if(page==="nominas") renderNominas(pc);
  else if(page==="retribuciones") renderRetribuciones(pc);
  // Las demás páginas se implementan en las siguientes partes
  else pc.innerHTML=`<div class="card"><div style="text-align:center;padding:40px;color:var(--muted)">Página "${page}" en desarrollo</div></div>`;
}

window.addEventListener("hashchange",()=>{const hash=window.location.hash.replace("#","");if(hash&&hash!==currentPage&&userProfile)navigate(hash);});
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");document.getElementById("overlay").classList.toggle("show");}
function closeSidebar(){document.getElementById("sidebar").classList.remove("open");document.getElementById("overlay").classList.remove("show");}

      <div class="stat"><div class="stat-lbl">IRPF aplicado</div><div class="stat-val c-a2">${p.irpf}%</div><div class="stat-note" style="cursor:pointer;color:var(--a3);text-decoration:underline" onclick="navigate('retribuciones')">Modificar</div></div>
    </div>

function pinKeyChange(k){
  if(!window._pinChangeBuf) window._pinChangeBuf='';
  if(k==='⌫'){ window._pinChangeBuf=window._pinChangeBuf.slice(0,-1); }
  else if(window._pinChangeBuf.length<4){ window._pinChangeBuf+=k; }
  for(let i=0;i<4;i++){
    const d=document.getElementById('cpd'+i);
    if(d){ d.style.background=i<window._pinChangeBuf.length?'var(--a1)':'transparent'; d.style.borderColor=i<window._pinChangeBuf.length?'var(--a1)':'var(--border)'; }
  }
  if(window._pinChangeBuf.length===4){
    setTimeout(()=>guardarNuevoPIN(window._pinChangeBuf),150);
    window._pinChangeBuf='';
  }
}

function cambiarMes(delta){
  selectedMonth+=delta;
  if(selectedMonth<0){selectedMonth=11;selectedYear--;}
  if(selectedMonth>11){selectedMonth=0;selectedYear++;}
  renderCalendarioGrid();
}

function renderCalendarioGrid(){
  const meses=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  document.getElementById("cal-mes-label").textContent=`${meses[selectedMonth]} ${selectedYear}`;
  
  const primerDia=new Date(selectedYear,selectedMonth,1).getDay();
  const diasMes=new Date(selectedYear,selectedMonth+1,0).getDate();
  const hoy=new Date();const hoyStr=hoy.toISOString().slice(0,10);
  
  let html='<div class="cal-grid">';
  ["L","M","X","J","V","S","D"].forEach(d=>html+=`<div class="cal-hd">${d}</div>`);
  
  const offset=(primerDia===0?6:primerDia-1);
  for(let i=0;i<offset;i++)html+='<div class="cal-day empty"></div>';
  
  for(let d=1;d<=diasMes;d++){
    const fecha=`${selectedYear}-${String(selectedMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isHoy=fecha===hoyStr;
    const isSelected=fecha===selectedDate;
    const turno=DEMO_TURNOS.find(t=>t.fecha===fecha);
    const hasEvento=DEMO_EVENTOS.some(e=>e.fecha===fecha);

// Verificar si la fecha está en una ausencia aprobada
    const ausenciasAprobadas = MIS_AUSENCIAS.filter(a => a.estado === 'aprobada');
    const enAusencia = ausenciasAprobadas.some(a => {
      const inicio = new Date(a.fecha_inicio + 'T00:00:00');
      const fin = new Date(a.fecha_fin + 'T23:59:59');
      const actual = new Date(fecha + 'T12:00:00');
      return actual >= inicio && actual <= fin;
    });
    
  let cls='cal-day';
    if(isHoy)cls+=' today';
    if(isSelected)cls+=' selected';
    if(enAusencia)cls+=' has-ausencia'; // ← NUEVA LÍNEA
    if(turno)cls+=' has-turno';
    if(hasEvento)cls+=' has-event';
    
    html+=`<div class="${cls}" onclick="selectDay('${fecha}')">${d}</div>`;
  }
  html+='</div>';
  document.getElementById("calendario-grid").innerHTML=html;
}

function selectDay(fecha){
  selectedDate=fecha;
  renderCalendarioGrid();
  
  const turnos=DEMO_TURNOS.filter(t=>t.fecha===fecha);
  const eventos=DEMO_EVENTOS.filter(e=>e.fecha===fecha);
  
  if(turnos.length===0&&eventos.length===0){
    document.getElementById("day-detail-container").innerHTML=`
      <div class="card-title">${new Date(fecha+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}</div>
      <div style="color:var(--muted);font-size:13px;padding-top:10px">Sin actividad programada.</div>`;
    return;
  }
  
  let html=`<div class="card-title">${new Date(fecha+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}</div>`;
  
  if(turnos.length>0){
    html+=`<div style="font-family:Syne,sans-serif;font-size:13px;font-weight:700;margin:16px 0 8px;color:var(--a3)">Tu turno</div>`;
    turnos.forEach(t=>{
      html+=`<div style="padding:12px;background:var(--bg);border-radius:9px;border:1px solid var(--border);margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="width:8px;height:8px;border-radius:50%;background:${t.tipo==="evento"?"var(--a2)":t.tipo==="rodaje"?"var(--a1)":t.tipo==="libre"?"var(--muted)":"var(--a3)"}"></span>
          <span style="font-weight:600">${t.tipo==="libre"?"Día libre":t.tipo}</span>
        </div>
        ${t.tipo!=="libre"?`<div style="font-size:12px;color:var(--muted)">${t.entrada}–${t.salida} · ${t.lugar||"—"}</div>`:""}
      </div>`;
    });
  }
  
  if(eventos.length>0){
    html+=`<div style="font-family:Syne,sans-serif;font-size:13px;font-weight:700;margin:16px 0 8px;color:var(--a2)">Eventos</div>`;
    eventos.forEach(e=>{
      html+=`<div style="padding:12px;background:var(--bg);border-radius:9px;border:1px solid var(--border);margin-bottom:8px;cursor:pointer" onclick="verEvento('${e.id}')">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-family:Syne,sans-serif;font-weight:600;font-size:13px">${e.nombre}</span>
          ${badge(e.estado)}
        </div>
        <div style="font-size:12px;color:var(--muted)">${e.lugar}</div>
      </div>`;
    });
  }
  
  document.getElementById("day-detail-container").innerHTML=html;
}

  const desc=document.getElementById("nt-desc").value.trim();
  
  if(!name||price<=0){toast("⚠️ Nombre y precio son obligatorios");return;}
  
  const{error}=await _sb.from('tickets').insert({
    event_id:selectedEvent.id,

    stock,

  if(error){toast("Error: "+error.message);return;}
  toast("Entrada creada ✓");

  await new Promise(r=>setTimeout(r,200));

}

  toast("Entrada eliminada ✓");

}

async function cargarInventario(){
  try{
    let query=_sb.from('inventario').select('*').order('nombre');
    if(userProfile.organization_id){
      query=query.eq('organization_id',userProfile.organization_id);
    }
    const{data}=await query;
    INVENTARIO=(data||[]).map(i=>({
      id:i.id,
      nombre:i.nombre,
      categoria:i.categoria,
      estado:i.estado||"disponible",
      ubicacion:i.ubicacion,
      notas:i.notas,
      organization_id:i.organization_id
    }));
  }catch(e){INVENTARIO=[];}
}

async function guardarNuevoInventario(){

async function guardarNuevaIncidencia(){
  const material=document.getElementById("ninc-material").value;
  const desc=document.getElementById("ninc-desc").value.trim();
  const prioridad=document.getElementById("ninc-prioridad").value;
  
  if(!material||!desc){toast("⚠️ Material y descripción son obligatorios");return;}
  
  let codigo="";
  if(material==="OTRO"){
    const{data:lastGeneric}=await _sb.from('incidencias').select('codigo').like('codigo','GEN-%').order('codigo',{ascending:false}).limit(1).single();
    if(lastGeneric){
      const num=parseInt(lastGeneric.codigo.split("-")[1])||0;
      codigo=`GEN-${String(num+1).padStart(3,'0')}`;
    }else{
      codigo="GEN-001";
    }
  }else{
    const itemInv=INVENTARIO.find(i=>i.nombre===material);
    codigo=itemInv?itemInv.id.slice(0,8).toUpperCase():"GEN-000";
  }
  
  const payload={
    codigo,
    material_afectado:material==="OTRO"?"Material genérico":material,
    descripcion:desc,
    estado:"abierta",
    prioridad,
    fecha_reporte:new Date().toISOString(),
    reportado_por:userProfile.nombre
  };
  
  if(userProfile.organization_id){
    payload.organization_id=userProfile.organization_id;
  }
  
  const{error}=await _sb.from('incidencias').insert(payload);
  if(error){toast("Error: "+error.message);return;}
  toast("Incidencia creada ✓");
  closeModal();
  await cargarIncidencias();
  renderIncidencias(document.getElementById("page-content"));
}

// MENSAJES (sistema simple de mensajería interna)
// ══════════════════════════════════════════════════════════════════════════

let MENSAJES=[];

async function renderMensajes(pc){
  await cargarMensajes();
  
  const destinatarios=DEMO_EMPLEADOS.filter(e=>e.id!==userProfile._supabase_id);
  
  pc.innerHTML=`
    <div class="page-hd">
      <div><div class="page-title">Mensajes</div><div class="page-sub">${unreadMsgCount} sin leer</div></div>
    </div>
    <div class="card">
      <div class="chat-container">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-bar">
          <select id="chat-dest">
            <option value="">Para...</option>
            ${destinatarios.map(e=>`<option value="${e.id}">${e.nombre}</option>`).join("")}
          </select>
          <input id="chat-input" placeholder="Escribe un mensaje..." onkeydown="if(event.key==='Enter')enviarMensaje()"/>
          <button onclick="enviarMensaje()">Enviar</button>
        </div>
      </div>
    </div>`;
  
  renderChatMessages();
}

async function cargarMensajes(){
  try{
    const{data}=await _sb.from('mensajes').select('*')
      .or(`de.eq.${userProfile._supabase_id},para.eq.${userProfile._supabase_id}`)
      .order('created_at',{ascending:false});
    MENSAJES=data||[];
    unreadMsgCount=MENSAJES.filter(m=>m.para===userProfile._supabase_id&&!m.leido).length;
    actualizarBadgeMensajes();
  }catch(e){MENSAJES=[];}
}

function renderChatMessages(){
  const container=document.getElementById("chat-messages");
  if(!container)return;
  
  const msgs=MENSAJES.slice(0,50).reverse();
  let lastDate="";
  let html="";
  
  msgs.forEach(m=>{
    const d=new Date(m.created_at);
    const dateStr=d.toLocaleDateString();
    
    if(dateStr!==lastDate){
      html+=`<div class="chat-date-sep">${dateStr}</div>`;
      lastDate=dateStr;
    }
    
    const isMine=m.de===userProfile._supabase_id;
    const sender=isMine?"Tú":DEMO_EMPLEADOS.find(e=>e.id===m.de)?.nombre||"?";
    const receiver=isMine?(DEMO_EMPLEADOS.find(e=>e.id===m.para)?.nombre||"?"):"Tú";
    
    html+=`
      <div class="chat-bubble-wrap ${isMine?'mine':'theirs'}">
        <div class="chat-bubble ${isMine?'mine':'theirs'}">
          ${!isMine?`<div class="chat-sender">${sender}</div>`:""}
          <div>${m.contenido}</div>
          <div class="chat-meta">
            <span>${d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</span>
            ${isMine?`<span class="chat-dest">→ ${receiver}</span>`:""}
          </div>
        </div>
      </div>`;
  });
  
  container.innerHTML=html||`<div style="text-align:center;color:var(--muted);padding:40px">Sin mensajes aún</div>`;
  container.scrollTop=container.scrollHeight;
}

async function enviarMensaje(){
  const dest=document.getElementById("chat-dest").value;
  const texto=document.getElementById("chat-input").value.trim();
  
  if(!dest||!texto){toast("⚠️ Selecciona destinatario y escribe un mensaje");return;}
  
  await _sb.from('mensajes').insert({
    de:userProfile._supabase_id,
    para:dest,
    contenido:texto,
    leido:false
  });
  
  document.getElementById("chat-input").value="";
  await cargarMensajes();
  renderChatMessages();
}

function actualizarBadgeMensajes(){
  const badge=document.getElementById("nav-badge-msg");
  if(badge){
    if(unreadMsgCount>0){
      badge.textContent=unreadMsgCount;
      badge.style.display="block";
    }else{
      badge.style.display="none";
    }
  }
}

function activarRealtime(){
  _sb.channel('mensajes-changes')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'mensajes'},()=>{
      if(currentPage==="mensajes"){cargarMensajes().then(renderChatMessages);}
      else{cargarMensajes();}
    })
    .subscribe();
}

async function guardarNuevaAusencia(){
  const tipo = document.getElementById("na-tipo").value;
  const inicio = document.getElementById("na-inicio").value;
  const fin = document.getElementById("na-fin").value;
  const motivo = document.getElementById("na-motivo").value.trim();
  
  if(!inicio || !fin){
    toast("⚠️ Las fechas son obligatorias");
    return;
  }
  
  // Calcular días entre fechas
  const d1 = new Date(inicio);
  const d2 = new Date(fin);
  const dias = Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
  
  if(dias <= 0){
    toast("⚠️ La fecha fin debe ser posterior a la de inicio");
    return;
  }
  
  const payload = {
    empleado_id: userProfile._supabase_id,
    empleado_nombre: userProfile.nombre,
    tipo,
    fecha_inicio: inicio,
    fecha_fin: fin,
    dias_totales: dias,
    motivo,
    estado: "pendiente"
  };
  
  if(userProfile.organization_id){
    payload.organization_id = userProfile.organization_id;
  }
  
  const {error} = await _sb.from('ausencias').insert(payload);
  if(error){
    toast("Error: " + error.message);
    return;
  }
  
  toast("Solicitud enviada ✓");
  closeModal();
  await cargarMisAusencias();
  renderAusencias(document.getElementById("page-content"));
}

function generarNominaEquipo(){
  const mesActual=new Date().toLocaleDateString('es-ES',{year:'numeric',month:'long'});
  
  showModal(`<button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">Generar Nóminas</div>
    <div style="color:var(--muted);font-size:13px;margin-bottom:16px">Esto generará nóminas para todos los empleados activos del mes actual.</div>
    
    <label class="form-lbl">Mes</label>
    <input class="form-input" id="gn-mes" value="${mesActual}" placeholder="Enero 2025"/>
    
    <div style="padding:14px;background:var(--bg);border-radius:9px;border:1px solid var(--border);margin-bottom:16px">
      <div style="font-size:12px;color:var(--muted)">Se generarán nóminas para <strong style="color:var(--a1)">${DEMO_EMPLEADOS.filter(e=>e.estado==="activo"&&e.tipo==="fijo").length} empleados</strong> con contrato fijo.</div>
    </div>
    
    <button class="btn btn-p btn-full" onclick="ejecutarGeneracionNominas()">Generar nóminas</button>`);
}

async function ejecutarGeneracionNominas(){
  const mes=document.getElementById("gn-mes").value.trim();
  if(!mes){toast("⚠️ Indica el mes");return;}
  
  const empleadosFijos=DEMO_EMPLEADOS.filter(e=>e.estado==="activo"&&e.tipo==="fijo");
  
  for(const emp of empleadosFijos){
    const bruto=emp.salario||0;
    const irpf=emp.irpf||15;
    const ret=Math.round(bruto*irpf/100);
    const ss=160;
    const neto=bruto-ret-ss;
    
    await _sb.from('nominas').insert({
      empleado_id:emp.id,
      empleado_nombre:emp.nombre,
      mes,
      bruto,
      irpf,
      retencion:ret,
      ss,
      neto,
      estado:"pendiente",
      generado_por:userProfile.nombre
    });
  }
  
  toast(`${empleadosFijos.length} nóminas generadas ✓`);
  closeModal();
}

async function cargarAusenciasPendientes(){
  try{
    let query = _sb.from('ausencias')
      .select('*')
      .eq('estado', 'pendiente')
      .order('created_at', {ascending: false});
    
    if(userProfile.organization_id){
      query = query.eq('organization_id', userProfile.organization_id);
    }
    
    const {data} = await query;
    AUSENCIAS_PENDIENTES = data || [];
  } catch(e){
    AUSENCIAS_PENDIENTES = [];
  }
}

async function cargarAusenciasAprobadas(){
  try{
    let query = _sb.from('ausencias')
      .select('*')
      .eq('estado', 'aprobada')
      .order('fecha_inicio', {ascending: false});
    
    if(userProfile.organization_id){
      query = query.eq('organization_id', userProfile.organization_id);
    }
    
    const {data} = await query;
    AUSENCIAS_APROBADAS = data || [];
  } catch(e){
    AUSENCIAS_APROBADAS = [];
  }
}

  const ausencia = AUSENCIAS_PENDIENTES.find(a => a.id === id);

  showModal(`<button class="modal-close" onclick="closeModal()">✕</button>

async function confirmarAprobarAusencia(id){
  const observaciones = document.getElementById("obs-aprobar").value.trim();
  
  const {error} = await _sb.from('ausencias').update({

  renderVistaAdminTurnos();
}

async function rechazarAusencia(id){
  const ausencia = AUSENCIAS_PENDIENTES.find(a => a.id === id);
  if(!ausencia) return;
  
  showModal(`<button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">Rechazar Ausencia</div>
    
    <div style="padding:14px;background:rgba(255,60,172,.1);border:1px solid rgba(255,60,172,.2);border-radius:9px;margin-bottom:16px">
      <div style="font-size:12px;color:var(--a2);margin-bottom:8px">⚠️ VAS A RECHAZAR ESTA SOLICITUD</div>
      <div style="font-weight:600">${ausencia.empleado_nombre}</div>
      <div style="font-size:13px;margin-top:4px">${ausencia.fecha_inicio} → ${ausencia.fecha_fin} (${ausencia.dias_totales} días)</div>
    </div>
    
    <label class="form-lbl">Motivo del rechazo *</label>
    <textarea class="form-textarea" id="obs-rechazar" placeholder="Explica el motivo del rechazo..."></textarea>
    
    <div style="display:flex;gap:8px">
      <button class="btn btn-danger btn-full" onclick="confirmarRechazarAusencia('${id}')">✕ Rechazar</button>
      <button class="btn btn-g" onclick="closeModal()">Cancelar</button>
    </div>`);
}

async function confirmarRechazarAusencia(id){
  const observaciones = document.getElementById("obs-rechazar").value.trim();
  
  if(!observaciones){
    toast("⚠️ Debes explicar el motivo del rechazo");
    return;
  }
  
  const {error} = await _sb.from('ausencias').update({
    estado: "rechazada",
    aprobado_por: userProfile._supabase_id,
    observaciones
  }).eq('id', id);
  
  if(error){
    toast("Error: " + error.message);
    return;
  }
  
  toast("Ausencia rechazada");
  closeModal();
  await cargarAusenciasPendientes();
  renderVistaAdminTurnos();
}

function nuevoTurno(){
  showModal(`<button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">Asignar Turno</div>
    
    <label class="form-lbl">Empleado *</label>
    <select class="form-select" id="nt-empleado">
      <option value="">-- Selecciona --</option>
      ${DEMO_EMPLEADOS.filter(e=>e.estado==="activo").map(e=>`<option value="${e.id}">${e.nombre}</option>`).join("")}
    </select>
    
    <label class="form-lbl">Fecha *</label>
    <input class="form-input" id="nt-fecha" type="text" placeholder="2025-06-15"/>
    
    <label class="form-lbl">Tipo de turno</label>
    <select class="form-select" id="nt-tipo">
      <option value="oficina">Oficina</option>
      <option value="evento">Evento</option>
      <option value="rodaje">Rodaje</option>
      <option value="libre">Día libre</option>
    </select>
    
    <label class="form-lbl">Hora entrada</label>
    <input class="form-input" id="nt-entrada" type="text" placeholder="09:00"/>
    
    <label class="form-lbl">Hora salida</label>
    <input class="form-input" id="nt-salida" type="text" placeholder="18:00"/>
    
    <label class="form-lbl">Lugar / Notas</label>
    <input class="form-input" id="nt-lugar" placeholder="Oficina central / Nombre del evento"/>
    
    <button class="btn btn-p btn-full" onclick="guardarNuevoTurno()">Asignar turno</button>`);
}

async function guardarNuevoTurno(){
  const empId=document.getElementById("nt-empleado").value;
  const fecha=document.getElementById("nt-fecha").value.trim();
  const tipo=document.getElementById("nt-tipo").value;
  const entrada=document.getElementById("nt-entrada").value.trim();
  const salida=document.getElementById("nt-salida").value.trim();
  const lugar=document.getElementById("nt-lugar").value.trim();
  
  if(!empId||!fecha){toast("⚠️ Empleado y fecha son obligatorios");return;}
  
  const emp=DEMO_EMPLEADOS.find(e=>e.id===empId);
  if(!emp)return;
  
  const{error}=await _sb.from('turnos').insert({
    empleado_id:empId,
    empleado_nombre:emp.nombre,
    fecha,
    tipo,
    hora_inicio:entrada,
    hora_fin:salida,
    notas:lugar
  });
  
  if(error){toast("Error: "+error.message);return;}
  toast("Turno asignado ✓");
  closeModal();
  await cargarTodosLosTurnos();
  renderAdminTurnos(document.getElementById("page-content"));
}

async function eliminarTurno(id){
  if(!confirm("¿Eliminar este turno?"))return;
  const{error}=await _sb.from('turnos').delete().eq('id',id);
  if(error){toast("Error: "+error.message);return;}
  toast("Turno eliminado ✓");
  await cargarTodosLosTurnos();
  renderAdminTurnos(document.getElementById("page-content"));
}

function generarPDFNomina(nominaId){
  const n=DEMO_NOMINAS.find(x=>x.id===nominaId);
  if(!n)return;
  
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  
  // Encabezado
  doc.setFontSize(20);
  doc.setTextColor(200,255,0);
  doc.text("InOut Media",20,20);
  
  doc.setFontSize(10);
  doc.setTextColor(100,100,100);
  doc.text("Portal Noctua",20,27);
  
  // Título
  doc.setFontSize(16);
  doc.setTextColor(0,0,0);
  doc.text("NÓMINA",20,45);
  
  // Info empleado
  doc.setFontSize(11);
  doc.text(`Empleado: ${n.empleadoNombre||userProfile.nombre}`,20,60);
  doc.text(`Mes: ${n.mes}`,20,67);
  doc.text(`Fecha emisión: ${new Date().toLocaleDateString()}`,20,74);
  
  // Línea divisoria
  doc.setDrawColor(200);
  doc.line(20,80,190,80);
  
  // Conceptos
  let y=90;
  doc.setFontSize(10);
  doc.setTextColor(100,100,100);
  doc.text("CONCEPTO",20,y);
  doc.text("IMPORTE",160,y);
  
  y+=10;
  doc.setTextColor(0,0,0);
  doc.text("Salario bruto",20,y);
  doc.text(`${(n.bruto||0).toLocaleString()} €`,160,y);
  
  y+=8;
  doc.setTextColor(255,60,172);
  doc.text(`IRPF (${n.irpf||15}%)`,20,y);
  doc.text(`-${Math.round((n.bruto||0)*(n.irpf||15)/100)} €`,160,y);
  
  y+=8;
  doc.text("Seguridad Social",20,y);
  doc.text(`-${n.ss||160} €`,160,y);
  
  // Total
  doc.setDrawColor(200);
  doc.line(20,y+5,190,y+5);
  
  y+=15;
  doc.setFontSize(12);
  doc.setTextColor(0,0,0);
  doc.text("NETO A PERCIBIR",20,y);
  doc.setTextColor(200,255,0);
  doc.setFontSize(14);
  doc.text(`${(n.neto||0).toLocaleString()} €`,160,y);
  
  // Pie
  doc.setFontSize(9);
  doc.setTextColor(150,150,150);
  doc.text("Documento generado automáticamente por el sistema InOut Media",20,280);
  
  doc.save(`nomina_${n.mes.replace(/\s+/g,'_')}.pdf`);
  toast("PDF descargado ✓");
}

}

function navigate(page){
  const adminPages=["admin","admin-irpf","admin-nominas","admin-turnos"];
  if(adminPages.includes(page)&&!canAdmin()){toast("⛔ Sin acceso");page="dashboard";}
  const extPages=["dashboard","perfil","mensajes"];
  if(userProfile?.role==="empresa_externa"&&!extPages.includes(page)){toast("⛔ Sin acceso");page="dashboard";}
  currentPage=page;window.location.hash=page;
  document.querySelectorAll(".nav-item").forEach(el=>el.classList.remove("active"));
  document.getElementById(`nav-${page}`)?.classList.add("active");
  document.getElementById("topbar-title").textContent=PAGE_TITLE[page]||page;
  closeSidebar();
  const pc=document.getElementById("page-content");pc.scrollTop=0;
  
 const routes = {
  dashboard,
  perfil: renderPerfil,
  nominas: renderNominas,
  retribuciones: renderRetribuciones,
  calendario: renderCalendario,
  ausencias: renderAusencias, // ← NUEVO
  eventos: renderEventos,
  inventario: renderInventario,
  incidencias: renderIncidencias,
  mensajes: renderMensajes,
  admin: renderAdmin,
  "admin-irpf": renderAdminIRPF,
  "admin-nominas": renderAdminNominas,
  "admin-turnos": renderAdminTurnos
};
  
  if(routes[page]){
    routes[page](pc);
  }else{
    pc.innerHTML=`<div class="card"><div style="text-align:center;padding:40px;color:var(--muted)">Página "${page}" en desarrollo</div></div>`;
  }
}
